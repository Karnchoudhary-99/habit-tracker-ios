name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Demo smoke test
        run: |
          swift build
          HT_STORE=/tmp/ht-demo.json .build/debug/ht demo
          HT_STORE=/tmp/ht-demo.json .build/debug/ht list
          HT_STORE=/tmp/ht-demo.json .build/debug/ht progress
  swiftui:
    # App/ is not a SwiftPM target (SwiftUI is Apple-only, while the engine
    # also builds on Linux), so type-check it against the built engine module.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engine module
        run: swift build
      - name: Type-check SwiftUI app
        run: swiftc -typecheck -I .build/debug App/*.swift
