name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Demo smoke test
        run: |
          swift build
          HT_STORE=/tmp/ht-demo.json .build/debug/ht demo
          HT_STORE=/tmp/ht-demo.json .build/debug/ht list
          HT_STORE=/tmp/ht-demo.json .build/debug/ht progress
  swiftui:
    # App/ is not a SwiftPM target (SwiftUI is Apple-only, while the engine
    # also builds on Linux), so type-check it against the built engine module.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engine module
        run: swift build
      - name: Type-check SwiftUI app
        run: |
          # SwiftPM's module dir varies by toolchain; locate it instead of guessing.
          MOD=$(find .build/debug -name 'HabitTracker.swiftmodule' -print -quit)
          if [ -z "$MOD" ]; then echo "HabitTracker.swiftmodule not found under .build/debug"; find .build/debug -maxdepth 2 | head -40; exit 1; fi
          swiftc -typecheck -I "$(dirname "$MOD")" App/*.swift
